<!DOCTYPE html>
<html>
<head>
    <title>LiveKit Agent Test</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f5f5f7; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #333; }
        button { background-color: #007aff; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background-color: #0063cc; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #666; }
        #log { margin-top: 1rem; text-align: left; font-size: 0.8rem; background: #eee; padding: 8px; border-radius: 4px; height: 100px; overflow-y: auto; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Voice Agent Test</h1>
        <button id="connectBtn">Connect to Agent</button>
        <div id="status">Ready</div>
        <div id="log"></div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        let room;

        function log(msg) {
            const entry = document.createElement('div');
            entry.textContent = `> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        connectBtn.onclick = async () => {
            if (room) {
                await room.disconnect();
                return;
            }

            try {
                connectBtn.disabled = true;
                statusDiv.textContent = "Fetching token...";
                
                const res = await fetch('/token?room=test-room');
                const data = await res.json();
                
                room = new LivekitClient.Room();
                
                room.on(LivekitClient.RoomEvent.Connected, () => {
                    statusDiv.textContent = "Connected to Room";
                    log("Connected to LiveKit");
                });

                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    statusDiv.textContent = "Disconnected";
                    connectBtn.textContent = "Connect to Agent";
                    connectBtn.disabled = false;
                    room = null;
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === "audio") {
                        const el = track.attach();
                        document.body.appendChild(el);
                        log("Agent audio subscribed");
                    }
                });

                await room.connect(data.url, data.token);
                await room.localParticipant.setMicrophoneEnabled(true);
                
                statusDiv.textContent = "Agent is Online";
                connectBtn.textContent = "Disconnect";
                connectBtn.disabled = false;
                log("Microphone active. Talk now!");

            } catch (err) {
                console.error(err);
                statusDiv.textContent = "Error: " + err.message;
                connectBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
