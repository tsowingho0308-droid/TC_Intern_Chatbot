<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent — Local</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #0f0f14; color: #e0e0e0;
        }
        .container { width: 420px; padding: 24px; }
        h1 { text-align: center; font-size: 1.3rem; margin-bottom: 24px; color: #fff; letter-spacing: -0.02em; }

        /* ── AI Orb ── */
        .orb-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .orb-stage {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            background: radial-gradient(circle at 36% 34%, #6b6b8a, #3a3a55 55%, #1e1e30);
            box-shadow: 0 0 30px rgba(110, 110, 180, 0.25), 0 0 60px rgba(110, 110, 180, 0.08);
            transition: background 0.5s, box-shadow 0.5s;
        }
        /* glass highlight */
        .orb::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 22%;
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.45), rgba(255,255,255,0));
            pointer-events: none;
        }
        /* ambient glow behind orb */
        .orb-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 1;
            filter: blur(28px);
            opacity: 0;
            transition: background 0.5s, opacity 0.5s;
        }
        /* concentric animation rings */
        .orb-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
        }
        .orb-ring.r1 { width: 100%; height: 100%; }
        .orb-ring.r2 { width: 100%; height: 100%; }
        /* processing arc ring */
        .orb-arc {
            position: absolute;
            width: calc(100% + 12px);
            height: calc(100% + 12px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            border: 3px solid transparent;
            border-top-color: #f59e0b;
            border-right-color: #f59e0b;
            transition: opacity 0.3s;
        }

        /* ── Orb states ── */
        /* idle: subtle breathe */
        .orb.idle {
            animation: orbBreathe 3.6s ease-in-out infinite;
        }
        @keyframes orbBreathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(110,110,180,0.25), 0 0 60px rgba(110,110,180,0.08); }
            50% { transform: scale(1.04); box-shadow: 0 0 38px rgba(110,110,180,0.32), 0 0 72px rgba(110,110,180,0.12); }
        }

        /* listening: green pulse + sonar rings */
        .orb.listening {
            background: radial-gradient(circle at 36% 34%, #6ee7b7, #22c55e 50%, #166534);
            box-shadow: 0 0 40px rgba(34,197,94,0.45), 0 0 80px rgba(34,197,94,0.18);
            animation: orbListenPulse 0.85s ease-in-out infinite;
        }
        .orb.listening + .orb-glow {
            background: #22c55e;
            opacity: 0.22;
        }
        .orb-stage.listening .orb-ring.r1 {
            animation: sonarRing 1.6s ease-out infinite;
            border-color: rgba(34,197,94,0.45);
        }
        .orb-stage.listening .orb-ring.r2 {
            animation: sonarRing 1.6s ease-out 0.53s infinite;
            border-color: rgba(34,197,94,0.35);
        }
        @keyframes orbListenPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }
        @keyframes sonarRing {
            0% { transform: scale(1); opacity: 0.7; border-width: 2px; }
            100% { transform: scale(2.2); opacity: 0; border-width: 0.5px; }
        }

        /* processing: amber with rotating arc */
        .orb.processing {
            background: radial-gradient(circle at 36% 34%, #fde68a, #f59e0b 50%, #92400e);
            box-shadow: 0 0 38px rgba(245,158,11,0.45), 0 0 78px rgba(245,158,11,0.18);
            animation: orbProcessBob 1.2s ease-in-out infinite;
        }
        .orb.processing + .orb-glow {
            background: #f59e0b;
            opacity: 0.2;
        }
        .orb-stage.processing .orb-arc {
            opacity: 1;
            animation: arcSpin 1s linear infinite;
        }
        @keyframes orbProcessBob {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.05); }
            60% { transform: scale(0.97); }
        }
        @keyframes arcSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* speaking: blue energetic pulse + breathing rings */
        .orb.speaking {
            background: radial-gradient(circle at 36% 34%, #93c5fd, #3b82f6 50%, #1e3a5f);
            box-shadow: 0 0 48px rgba(59,130,246,0.55), 0 0 96px rgba(59,130,246,0.25);
            animation: orbSpeakPulse 0.45s ease-in-out infinite;
        }
        .orb.speaking + .orb-glow {
            background: #3b82f6;
            opacity: 0.28;
        }
        .orb-stage.speaking .orb-ring.r1 {
            animation: breatheRing 0.9s ease-in-out infinite;
            border-color: rgba(59,130,246,0.4);
        }
        .orb-stage.speaking .orb-ring.r2 {
            animation: breatheRing 0.9s ease-in-out 0.35s infinite;
            border-color: rgba(59,130,246,0.3);
        }
        @keyframes orbSpeakPulse {
            0%, 100% { transform: scale(1); }
            35% { transform: scale(1.06); }
            70% { transform: scale(0.98); }
        }
        @keyframes breatheRing {
            0%, 100% { transform: scale(1); opacity: 0.25; }
            50% { transform: scale(1.18); opacity: 0.55; }
        }

        .status-label { font-size: 0.82rem; color: #888; margin-top: 10px; letter-spacing: 0.03em; transition: color 0.3s; }

        .btn-row { display: flex; gap: 8px; margin-bottom: 20px; }
        button {
            flex: 1; padding: 12px 0; font-size: 0.95rem; font-weight: 600;
            border: none; border-radius: 10px; cursor: pointer; transition: background 0.15s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-connect { background: #4f46e5; color: #fff; }
        .btn-connect:hover:not(:disabled) { background: #4338ca; }
        .btn-connect.connected { background: #dc2626; }
        .btn-connect.connected:hover:not(:disabled) { background: #b91c1c; }
        .btn-mute { background: #374151; color: #d1d5db; flex: 0.5; }
        .btn-mute:hover:not(:disabled) { background: #4b5563; }
        .btn-mute.muted { background: #92400e; color: #fbbf24; }
        .btn-reset { background: #374151; color: #d1d5db; flex: 0.5; }
        .btn-reset:hover:not(:disabled) { background: #4b5563; }

        .card {
            background: #1a1a24; border-radius: 12px; padding: 16px;
            margin-bottom: 12px; border: 1px solid #27272a;
        }
        .card h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 8px; }
        .transcript-box { min-height: 48px; font-size: 1.05rem; color: #f1f5f9; word-wrap: break-word; }
        .transcript-box.interim { color: #888; font-style: italic; }

        .log-box { max-height: 200px; overflow-y: auto; font-size: 0.8rem; }
        .log-entry { padding: 4px 0; border-bottom: 1px solid #222; display: flex; gap: 8px; }
        .log-entry:last-child { border-bottom: none; }
        .log-role { color: #818cf8; font-weight: 600; min-width: 42px; flex-shrink: 0; }
        .log-text { color: #d1d5db; }

        .footer { text-align: center; font-size: 0.7rem; color: #555; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Agent</h1>

        <div class="orb-section">
            <div class="orb-stage" id="orbStage">
                <div class="orb" id="orb"></div>
                <div class="orb-glow"></div>
                <div class="orb-ring r1"></div>
                <div class="orb-ring r2"></div>
                <div class="orb-arc"></div>
            </div>
            <div class="status-label" id="statusLabel">Ready</div>
        </div>

        <div class="btn-row">
            <button class="btn-connect" id="connectBtn" onclick="toggleConnection()">Connect</button>
            <button class="btn-mute" id="muteBtn" onclick="toggleMic()" disabled>Mute</button>
            <button class="btn-reset" id="resetBtn" onclick="resetChat()" disabled>Reset</button>
        </div>

        <div class="card">
            <h3>You said</h3>
            <div class="transcript-box" id="userTranscript"></div>
        </div>

        <div class="card">
            <h3>Agent says</h3>
            <div class="transcript-box" id="agentTranscript"></div>
        </div>

        <div class="card">
            <h3>Conversation</h3>
            <div class="log-box" id="logBox">
                <div style="color:#555;text-align:center;padding:12px;">Connect and start talking...</div>
            </div>
        </div>

        <div class="footer">16kHz mono PCM &middot; WebSocket direct</div>
    </div>

    <script>
        // ── DOM refs ──
        const orb = document.getElementById('orb');
        const orbStage = document.getElementById('orbStage');
        const statusLabel = document.getElementById('statusLabel');
        const connectBtn = document.getElementById('connectBtn');
        const muteBtn = document.getElementById('muteBtn');
        const resetBtn = document.getElementById('resetBtn');
        const userTranscript = document.getElementById('userTranscript');
        const agentTranscript = document.getElementById('agentTranscript');
        const logBox = document.getElementById('logBox');

        // ── State ──
        let ws = null;
        let audioCtx = null;
        let workletNode = null;
        let micStream = null;
        let connected = false;
        let listening = false;
        const SAMPLE_RATE = 16000;
        const SILENCE_THRESHOLD = 0.012;
        const SILENCE_DURATION_MS = 400;
        let silenceStart = null;
        let isAgentSpeaking = false;
        let ttsChunks = [];
        let playbackCtx = null;
        let muted = false;

        function setStatus(state) {
            orb.className = 'orb ' + state;
            orbStage.className = 'orb-stage ' + state;
            const labels = {
                idle: 'Ready',
                listening: 'Listening...',
                processing: 'Thinking...',
                speaking: 'Speaking...',
            };
            statusLabel.textContent = labels[state] || state;
        }

        function addLog(role, text) {
            if (logBox.querySelector('div[style]')) logBox.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-role">${role}</span><span class="log-text">${text}</span>`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ── WebSocket ──
        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                connected = true;
                connectBtn.textContent = 'Disconnect';
                connectBtn.classList.add('connected');
                muteBtn.disabled = false;
                resetBtn.disabled = false;
                setStatus('idle');
                startMic();
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'transcript') {
                        userTranscript.textContent = msg.text;
                        addLog('You', msg.text);
                    } else if (msg.type === 'response') {
                        agentTranscript.textContent = msg.text;
                        addLog('Agent', msg.text);
                    } else if (msg.type === 'tts_start') {
                        isAgentSpeaking = true;
                        ttsChunks = [];
                        setStatus('speaking');
                    } else if (msg.type === 'tts_done') {
                        if (ttsChunks.length > 0) {
                            playFullAudio(ttsChunks);
                            ttsChunks = [];
                        }
                        isAgentSpeaking = false;
                        setStatus(listening ? 'listening' : 'idle');
                    } else if (msg.type === 'reset_done') {
                        logBox.innerHTML = '<div style="color:#555;text-align:center;padding:12px;">Conversation reset.</div>';
                        userTranscript.textContent = '';
                        agentTranscript.textContent = '';
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    ttsChunks.push(new Int16Array(event.data));
                }
            };

            ws.onclose = () => {
                connected = false;
                stopMic();
                connectBtn.textContent = 'Connect';
                connectBtn.classList.remove('connected');
                muteBtn.disabled = true;
                muteBtn.textContent = 'Mute';
                muteBtn.classList.remove('muted');
                muted = false;
                resetBtn.disabled = true;
                setStatus('idle');
                ws = null;
            };

            ws.onerror = () => { /* onclose will fire next */ };
        }

        // ── Audio capture ──
        async function startMic() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: SAMPLE_RATE,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });
                audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });

                // ScriptProcessorNode for PCM access (deprecated but widely supported)
                const source = audioCtx.createMediaStreamSource(micStream);
                workletNode = audioCtx.createScriptProcessor(2048, 1, 1);

                workletNode.onaudioprocess = (event) => {
                    if (!connected || !ws || ws.readyState !== WebSocket.OPEN) return;
                    const input = event.inputBuffer.getChannelData(0);
                    const pcm = float32ToInt16(input);

                    // Send raw audio
                    ws.send(pcm.buffer);

                    // VAD
                    const rms = Math.sqrt(input.reduce((sum, v) => sum + v * v, 0) / input.length);
                    const now = Date.now();

                    if (rms > SILENCE_THRESHOLD) {
                        if (!listening) {
                            listening = true;
                            setStatus('listening');
                            if (isAgentSpeaking) {
                                ws.send(JSON.stringify({ type: 'interrupt' }));
                                isAgentSpeaking = false;
                            }
                        }
                        silenceStart = null;
                    } else if (listening) {
                        if (!silenceStart) silenceStart = now;
                        if (now - silenceStart > SILENCE_DURATION_MS) {
                            listening = false;
                            setStatus('processing');
                            ws.send(JSON.stringify({ type: 'end' }));
                        }
                    }
                };

                source.connect(workletNode);
                workletNode.connect(audioCtx.destination); // silent pass-through
                setStatus('idle');
            } catch (err) {
                console.error('Mic error:', err);
                statusLabel.textContent = 'Mic denied or unavailable';
            }
        }

        function stopMic() {
            listening = false;
            if (workletNode) {
                workletNode.disconnect();
                workletNode = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            if (playbackCtx) {
                playbackCtx.close();
                playbackCtx = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
        }

        function float32ToInt16(float32) {
            const int16 = new Int16Array(float32.length);
            for (let i = 0; i < float32.length; i++) {
                const s = Math.max(-1, Math.min(1, float32[i]));
                int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return int16;
        }

        function int16ToFloat32(int16) {
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);
            }
            return float32;
        }

        // ── Audio playback ──
        function playFullAudio(chunks) {
            if (!playbackCtx || playbackCtx.state === 'closed') {
                playbackCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
            }
            // Concatenate all chunks into one Int16Array
            const totalLen = chunks.reduce((s, c) => s + c.length, 0);
            const combined = new Int16Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) {
                combined.set(chunk, offset);
                offset += chunk.length;
            }
            const float32 = int16ToFloat32(combined);
            const buf = playbackCtx.createBuffer(1, float32.length, SAMPLE_RATE);
            buf.getChannelData(0).set(float32);
            const source = playbackCtx.createBufferSource();
            source.buffer = buf;
            source.connect(playbackCtx.destination);
            source.start();
        }

        // ── Controls ──
        function toggleMic() {
            muted = !muted;
            if (micStream) {
                micStream.getAudioTracks().forEach(t => t.enabled = !muted);
            }
            muteBtn.textContent = muted ? 'Unmute' : 'Mute';
            muteBtn.classList.toggle('muted', muted);
        }

        function toggleConnection() {
            if (connected) {
                if (ws) ws.close();
            } else {
                connectWS();
            }
        }

        function resetChat() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset' }));
            }
        }
    </script>
</body>
</html>
